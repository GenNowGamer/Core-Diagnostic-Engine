# CDE rEFInd configuration
# Deterministic CDE menu for removable media diagnostics.

# Display & Menu Settings
resolution 1024 768
textonly false
timeout 12
use_nvram false
log_level 2

# Boot Discovery
# Only show manual entries; hide firmware boot entries and auto-discovered items
scanfor manual
include_firmware_drivers false

# Disable scanning for drivers to prevent unwanted entries
scan_driver_dirs none

menuentry "CDE WinPE" {
    icon \EFI\boot\icons\cde_brand.png
    loader \EFI\microsoft\boot\bootmgfw.efi
}

menuentry "Core Hardware Utility (CHU)" {
    icon \EFI\boot\icons\chu_icon.png
    loader \EFI\CDE\CoreDiag.efi
}