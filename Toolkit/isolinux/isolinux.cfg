# ISOLINUX Boot Configuration for CDE Diagnostic Suite
# Format: ISOLINUX 6.x
# Purpose: Provides boot menu for systems that load from optical media (CD/DVD)
# This configuration matches MRI's multi-boot approach with Windows PE fallback

# Serial port configuration (optional - uncomment to enable serial redirection)
# serial 0 19200

# Default boot entry
default boot

# Display boot menu message on startup
display boot.msg

# Boot menu timeout (in 1/10ths of a second; 250 = 25 seconds)
timeout 250

# Allow user to press 'Tab' to edit kernel command line
prompt 1

# UI module for better menu support
# ui menu.c32

# Menu title
# menu title CDE Diagnostic Suite - Boot Options

# ===== BOOT MENU ENTRIES =====

label boot
    # Default: CDE Diagnostic Suite (recommended)
    # Boots Windows PE with ToolkitGUI
    kernel vmlinuz
    append rw vga=1 initrd=initrd.cgz,scsi.cgz loglevel=1
    # rw                = read/write filesystem
    # vga=1             = VGA text mode (graphical if supported)
    # initrd            = initial ramdisk (base + SCSI drivers)
    # loglevel=1        = minimal kernel logging (less spam)

label shell
    # Advanced: CDE Command Shell
    # Boots to command prompt for manual diagnostics
    kernel vmlinuz
    append rw vga=1 initrd=initrd.cgz,scsi.cgz loglevel=1 init=/bin/bash

label memtest
    # Memory: Memory Diagnostic Tool
    # Runs comprehensive memory testing
    # (Note: MemTest86 image would be used here if available)
    kernel vmlinuz
    append rw vga=1 initrd=initrd.cgz loglevel=1

label hd
    # Boot from Hard Drive
    # Exits diagnostic environment and boots installed OS
    localboot 0x80

label reboot
    # Reboot System
    # Immediately reboots the computer
    com32 reboot.c32

# ===== COMMENT SECTION =====
# ISOLINUX Boot Keys:
# - Tab to edit command line
# - Esc to cancel
# - Ctrl+Alt+Del to reboot
# Kernel modules:
# - vmlinuz = Linux kernel
# - initrd.cgz = Base filesystem drivers
# - scsi.cgz = SCSI/SAS controller support

