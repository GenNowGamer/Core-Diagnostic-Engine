; CDE Beta Test - MRI-like Diagnostic Environment Configuration
; This file controls runtime behavior for both Windows and WinPE modes

[Localization]
Language=en-US
Skin=CDE
Region=US

[Runtime]
ShowSplash=false
LogLevel=Info
Environment=Auto

[Application]
AppName=CDE Diagnostic Suite
Version=1.0.4
BuildDate=2026-11-11

[BootBehavior]
DefaultBootOption=ToolkitGUI
AllowBootMenu=true
MenuTimeout=30
ShowAdvancedOptions=false

[Tools]
AutoDiscoverTools=true
ValidateToolsOnStartup=false

[Logging]
LogPath=Logs\
MaxLogAge=30
EnableDebugLogging=false























































































